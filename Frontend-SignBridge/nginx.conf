# Nginx: sirve la SPA de React y hace de proxy inverso hacia la API.
#
#   navegador ──► nginx:80 ──► /           → archivos de dist/
#                         └──► /api/...    → backend:8000/...  (red interna)
#
# Como todo sale del mismo dominio, no hace falta CORS y el backend no
# necesita estar expuesto al exterior.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # no anunciar la versión de Nginx
    client_max_body_size 50m;     # los videos de señas se suben por la API

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La app usa cámara (señas) y micrófono (voz) solo desde su propio origen
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────────
    # La barra final de proxy_pass quita el prefijo: /api/auth/login → /auth/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # la detección de señas puede tardar
    }

    # ── Archivos con hash en el nombre (Vite): se cachean un año ─────────
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ── SPA: cualquier otra ruta la resuelve React Router ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
