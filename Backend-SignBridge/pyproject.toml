[project]
name = "signbridge-backend"
version = "1.0.0"
description = "API REST de SignBridge: traducción texto/voz <-> Lengua de Señas Colombiana (FastAPI)"
readme = "README.md"
# mediapipe 0.10.14 publica ruedas hasta Python 3.12
requires-python = ">=3.11,<3.13"

# Versiones EXACTAS (==), sin rangos: el mismo código instala lo mismo en
# todas las máquinas y en el CI. Para actualizar algo se cambia aquí, se
# corre `uv lock` y se sube el uv.lock en el mismo PR.
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "aiosmtplib==3.0.1",
    "jinja2==3.1.4",
    "python-dotenv==1.0.1",
    "bcrypt==4.0.1",
    # Procesamiento de imágenes y detección de señas (H03)
    "Pillow==10.3.0",
    "numpy==1.26.4",
    "mediapipe==0.10.14",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "reportlab==4.2.2",
]

[tool.uv]
# Es una app, no una librería: uv no intenta empaquetarla.
package = false
