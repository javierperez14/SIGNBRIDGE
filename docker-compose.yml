# ==============================================================================
# SignBridge — stack completo
#
#   cp .env.example .env      # y cambia SECRET_KEY y las credenciales
#   docker compose up -d --build
#
#   App (Nginx)  → http://localhost:8080
#   API docs     → http://localhost:8080/api/docs
#
# Redes: cada servicio solo ve lo que necesita
#
#   navegador ──► web (Nginx) ──[red_frontend]──► backend ──[red_datos]──► postgres
#
#   - red_frontend: Nginx ↔ backend. Nginx NO puede llegar a la base.
#   - red_datos:    backend ↔ postgres. Solo el backend habla con la base.
# ==============================================================================

services:
  postgres:
    image: postgres:17
    container_name: signbridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD - copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:-signbridge}
    # Solo en 127.0.0.1: DBeaver funciona desde tu equipo, pero nadie de la
    # red (wifi del SENA, por ejemplo) puede conectarse a la base.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-signbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - red_datos

  backend:
    build:
      context: ./Backend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_backend
    restart: unless-stopped
    # Expuesto solo en 127.0.0.1 para depurar con curl/Postman. La app lo
    # usa a través de Nginx (/api).
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Backend-SignBridge:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signbridge}
      SECRET_KEY: ${SECRET_KEY:?falta SECRET_KEY - copia .env.example a .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@signbridge.com}
      MAIL_SERVER: ${MAIL_SERVER:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      APP_NAME: ${APP_NAME:-Sign_Bridge}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    # 1. Aplica las migraciones pendientes.
    # 2. Arranca la API. --root-path /api hace que /docs funcione detrás de
    #    Nginx (http://localhost:8080/api/docs).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --root-path /api --proxy-headers --forwarded-allow-ips '*'"
    networks:
      - red_frontend
      - red_datos

  web:
    build:
      context: ./Frontend-SignBridge
      dockerfile: Dockerfile
    container_name: signbridge_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - red_frontend

volumes:
  postgres_data:

networks:
  red_frontend:
    driver: bridge
  red_datos:
    driver: bridge
